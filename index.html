<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas — Laboratório AHEAD AGRO</title>
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <body>
    <main class="card">
      <h1>📋 Minhas Tarefas</h1>
      <p class="sub">Ambiente de <strong>teste</strong> · dados no Supabase</p>

      <form id="new-task-form">
        <input
          id="task-title"
          type="text"
          placeholder="O que precisa ser feito?"
          autocomplete="off"
        />
        <button type="submit">Adicionar</button>
      </form>

      <ul id="task-list"></ul>
      <p id="status" class="status">Carregando…</p>
    </main>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
